name: Build WeChat Mini Game

on:
  push:
    branches: [wechat-minigame]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare mini game package
        shell: bash
        run: |
          set -e
          rm -rf dist/wechat-minigame
          mkdir -p dist/wechat-minigame

          cp -R minigame/. dist/wechat-minigame/
          rm -f dist/wechat-minigame/src/main.js

          cp app.js dist/wechat-minigame/app-core.js
          cp board_adapter.js dist/wechat-minigame/app-board.js
          cp -R data dist/wechat-minigame/data
          cp -R assets dist/wechat-minigame/assets

          python3 minigame/build/patch-core.py dist/wechat-minigame/app-core.js

          find dist/wechat-minigame/data -type f -name '*.js' -print0 | \
            xargs -0 sed -i 's/window\./GameGlobal./g'

          sed -i \
            -e 's/window\.requestAnimationFrame/GameGlobal.__RAF__/g' \
            -e 's/window\.cancelAnimationFrame/GameGlobal.__CAF__/g' \
            -e 's/window\.scrollTo/GameGlobal.__SCROLL_TO__/g' \
            -e 's/window\.scrollY/GameGlobal.__scrollY/g' \
            -e 's/window\.setTimeout/setTimeout/g' \
            -e 's/window\.clearTimeout/clearTimeout/g' \
            -e 's/window\.setInterval/setInterval/g' \
            -e 's/window\.clearInterval/clearInterval/g' \
            -e 's/window\.addEventListener/GameGlobal.__ADD_EVENT_LISTENER__/g' \
            -e 's/window\.removeEventListener/GameGlobal.__REMOVE_EVENT_LISTENER__/g' \
            -e 's/window\.alert/GameGlobal.__ALERT__/g' \
            -e 's/window\.confirm/GameGlobal.__CONFIRM__/g' \
            -e 's/window\./GameGlobal./g' \
            -e 's/document\./GameGlobal.__DOC__./g' \
            -e 's/localStorage\./GameGlobal.__STORAGE__./g' \
            dist/wechat-minigame/app-core.js dist/wechat-minigame/app-board.js

      - name: Syntax check
        shell: bash
        run: |
          set -e
          node --check dist/wechat-minigame/game.js
          node --check dist/wechat-minigame/src/config.js
          node --check dist/wechat-minigame/src/dom-adapter.js
          node --check dist/wechat-minigame/src/native-bridge.js
          node --check dist/wechat-minigame/src/renderer.js
          python3 -m py_compile minigame/build/patch-core.py
          node --check dist/wechat-minigame/app-core.js
          node --check dist/wechat-minigame/app-board.js
          find dist/wechat-minigame/data -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Runtime smoke test
        shell: bash
        run: |
          set -e
          cat > /tmp/minigame-smoke.js <<'SMOKE'
          const path=require("path");
          global.GameGlobal={};
          Object.defineProperty(global.GameGlobal,"document",{get:()=>({native:true}),configurable:false});
          Object.defineProperty(global.GameGlobal,"localStorage",{get:()=>({native:true}),configurable:false});
          const noop=()=>{};
          function grad(){return {addColorStop:noop};}
          const ctx=new Proxy({
            scale:noop,clearRect:noop,fillRect:noop,beginPath:noop,moveTo:noop,lineTo:noop,arcTo:noop,
            closePath:noop,fill:noop,stroke:noop,drawImage:noop,save:noop,restore:noop,
            translate:noop,rotate:noop,arc:noop,rect:noop,clip:noop,
            createLinearGradient:grad,createRadialGradient:grad,
            measureText:s=>({width:String(s||"").length*7}),
            fillText:noop
          },{get:(o,k)=>k in o?o[k]:0,set:(o,k,v)=>(o[k]=v,true)});
          const canvas={
            width:390,height:844,
            getContext:()=>ctx,
            createImage:()=>({width:0,height:0,onload:null,onerror:null,set src(v){this._src=v;}})
          };
          let canvasCreateCount=0;
          const store={};
          global.wx={
            getWindowInfo:()=>({windowWidth:390,windowHeight:844,pixelRatio:1,safeArea:{top:0}}),
            getSystemInfoSync:()=>({windowWidth:390,windowHeight:844,pixelRatio:1,safeArea:{top:0}}),
            createCanvas:()=>{canvasCreateCount+=1;return canvas;},
            createImage:()=>canvas.createImage(),
            getStorageSync:k=>store[k]||"",
            setStorageSync:(k,v)=>{store[k]=v;},
            removeStorageSync:k=>{delete store[k];},
            clearStorageSync:()=>{for(const k of Object.keys(store))delete store[k];},
            showShareMenu:noop,onShareAppMessage:noop,shareAppMessage:noop,
            onTouchStart:noop,onTouchMove:noop,onTouchEnd:noop,
            showKeyboard:noop,hideKeyboard:noop,onKeyboardInput:noop,onKeyboardConfirm:noop,onKeyboardComplete:noop,
            showActionSheet:noop,showToast:noop
          };
          const entry=process.argv[2];
          require(path.resolve(entry));
          if(!global.GameGlobal.__VDOM__)throw new Error("virtual DOM not initialized");
          if(typeof global.GameGlobal.__MINI_RENDER__!=="function")throw new Error("renderer not initialized");
          if(typeof global.GameGlobal.__ENDING_PARSE__!=="function")throw new Error("ending parser not initialized");
          const statsSample='<div class="ending-stat"><span>知识</span><strong>95</strong></div><div class="ending-stat"><span>体力</span><strong>68</strong></div>';
          const journeySample='<div class="journey-item"><span>本科</span><strong>温州医科大学</strong></div><div class="journey-item"><span>硕士</span><strong>北京大学医学部</strong></div>';
          const parsedStats=global.GameGlobal.__ENDING_PARSE__(statsSample,"ending-stat");
          const parsedJourney=global.GameGlobal.__ENDING_PARSE__(journeySample,"journey-item");
          if(parsedStats.length!==2||parsedStats[0].label!=="知识"||parsedStats[1].value!=="68")throw new Error("ending stats parser failed");
          if(parsedJourney.length!==2||parsedJourney[0].value!=="温州医科大学"||parsedJourney[1].label!=="硕士")throw new Error("career archive parser failed");
          if(canvasCreateCount!==1)throw new Error("expected exactly one onscreen canvas, got "+canvasCreateCount);
          if(global.GameGlobal.canvas!==canvas)throw new Error("renderer is not using reserved onscreen canvas");
          const E=global.GameGlobal.__VDOM__.elements;
          function visible(){
            for(const id of ["startScreen","gaokaoScreen","schoolScreen","letterScreen","gameScreen","endingScreen"]){
              if(E[id]&&!E[id].hidden)return id;
            }
            return "none";
          }
          if(visible()!=="startScreen")throw new Error("start screen not visible");
          if(!E.difficultyGrid.children.length)throw new Error("difficulty cards not rendered");
          E.startBtn.click();
          if(visible()!=="gaokaoScreen")throw new Error("failed to enter gaokao screen");
          E.rollBtn.click();
          setTimeout(()=>{
            E.stopBtn.click();
            if(!(Number(E.scoreDisplay.textContent)>=280))throw new Error("gaokao score not generated");
            if(!(E.goSchoolBtn.listeners.click||[]).length)throw new Error("school navigation not wired");
            E.goSchoolBtn.click();
            if(visible()!=="schoolScreen")throw new Error("failed to enter school screen");
            const school=E.schoolGrid.children[0];
            if(!school)throw new Error("no eligible school card rendered");
            school.click();
            if(visible()!=="letterScreen")throw new Error("failed to enter admission letter");
            E.enterUniversityBtn.click();
            if(visible()!=="gameScreen")throw new Error("failed to enter university");
            if(E.openSupplyBtn.hidden!==true)throw new Error("ad supply entry must stay hidden without adUnitId");
            if((E.inventoryLockNote.textContent||"").includes("广告"))throw new Error("ad copy leaked into no-ad inventory UI");
            const inv=E.inventoryItems.rawHTML||E.inventoryItems.innerHTML||"";
            if(!inv.includes("体力恢复卡")||!inv.includes("心理恢复卡")||!inv.includes("决策提示卡"))throw new Error("starter items missing");
            const choice=E.choices.children[0];
            if(!choice)throw new Error("story choices not rendered");
            choice.click();
            if(visible()!=="gameScreen"&&visible()!=="endingScreen")throw new Error("story choice navigation failed");
            console.log("Mini Game runtime + interaction smoke test passed.");
            setTimeout(()=>process.exit(0),40);
          },120);
          SMOKE
          node /tmp/minigame-smoke.js dist/wechat-minigame/game.js

      - name: Privacy scan
        shell: bash
        run: |
          set -e
          PATTERN='Honghu2527|Honghu|2527|github\.com|game_doctor|game-doctor|honghuzhang|gmail\.com'
          if grep -RniE "$PATTERN" dist/wechat-minigame; then
            echo "Privacy scan failed: developer identity found in upload package."
            exit 1
          fi
          echo "Privacy scan passed."

      - name: Verify Mini Game structure
        shell: bash
        run: |
          set -e
          test -f dist/wechat-minigame/game.js
          test -f dist/wechat-minigame/game.json
          test -f dist/wechat-minigame/project.config.json
          test -f dist/wechat-minigame/app-core.js
          test -f dist/wechat-minigame/app-board.js
          test -f dist/wechat-minigame/src/renderer.js
          test -f dist/wechat-minigame/assets/ui/medical-logo.webp
          test -f dist/wechat-minigame/assets/bg/undergrad_ai.webp
          test ! -f dist/wechat-minigame/src/main.js
          grep -q '"compileType": "game"' dist/wechat-minigame/project.config.json
          grep -q '"appid": "wx593dd9974d74c564"' dist/wechat-minigame/project.config.json
          echo "Mini Game package structure verified."

      - name: Upload mini game artifact
        uses: actions/upload-artifact@v4
        with:
          name: medical-life-wechat-minigame-web-parity
          path: dist/wechat-minigame
          if-no-files-found: error
          retention-days: 90
